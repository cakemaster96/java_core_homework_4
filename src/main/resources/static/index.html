<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи — JavaCore</title>
    <style>
        :root { color-scheme: light; --ink: #172c43; --muted: #607186; --line: #dce4ec; --accent: #126a67; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f6f8; color: var(--ink); font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
        main { max-width: 1400px; margin: auto; padding: 40px 28px 64px; }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .16em; }
        h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.04em; }
        .intro { margin: 8px 0 28px; color: var(--muted); }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .tab { border: 0; border-bottom: 3px solid transparent; background: none; padding: 12px 16px; color: var(--muted); font-weight: 650; }
        .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
        .panel { background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 24px #172c4305; }
        .search { padding: 24px; margin-bottom: 22px; }
        h2 { font-size: 19px; margin: 0 0 18px; }
        .filters { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 160px; flex: 1; }
        .operation-field { flex: 1.4; min-width: 240px; }
        label { font-size: 13px; font-weight: 650; }
        input, select { width: 100%; min-height: 44px; border: 1px solid #c9d4df; border-radius: 8px; padding: 9px 11px; background: white; color: var(--ink); }
        input:focus, select:focus, button:focus-visible { outline: 3px solid #126a6733; outline-offset: 2px; }
        .button { min-height: 44px; border-radius: 8px; padding: 10px 17px; border: 1px solid var(--accent); font-weight: 650; background: var(--accent); color: white; }
        .button:hover { background: #0e5553; }
        .button.secondary { background: white; border-color: #c9d4df; color: var(--ink); }
        .button.secondary:hover { background: #edf3f5; }
        button:disabled { opacity: .55; cursor: wait; }
        .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
        .status { border-radius: 8px; padding: 12px 16px; background: #edf3f7; color: var(--muted); margin: 0 0 18px; overflow-wrap: anywhere; }
        .status.error { color: #9a2929; background: #fff0ee; }
        .status.success { color: #135e45; background: #eaf7ef; }
        .table-heading { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
        .table-heading h2 { margin: 0; }
        .count { font-size: 13px; padding: 4px 10px; border-radius: 20px; color: var(--accent); background: #e9f4f2; white-space: nowrap; }
        .table-scroll { overflow-x: auto; border-radius: 0 0 16px 16px; }
        table { border-collapse: collapse; width: 100%; min-width: 940px; text-align: left; font-size: 14px; }
        th { background: #f8fafb; color: var(--muted); font-size: 12px; font-weight: 650; }
        th, td { padding: 14px 18px; border-bottom: 1px solid #edf1f5; vertical-align: top; }
        td { overflow-wrap: anywhere; max-width: 280px; }
        td:nth-child(1), td:nth-child(3) { white-space: nowrap; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #f8fbfb; }
        .empty-row { text-align: center; padding: 48px 20px; color: var(--muted); }
        .create-panel { max-width: 820px; padding: 28px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 24px; }
        .wide { grid-column: 1 / -1; }
        [hidden] { display: none !important; }
        @media (max-width: 640px) {
            main { padding: 24px 14px 40px; }
            .search, .create-panel { padding: 18px; }
            .field, .operation-field { min-width: 100%; }
            .filters .button { flex: 1; }
            .form-grid { grid-template-columns: 1fr; }
            .table-heading { padding: 18px; }
            .tab { padding: 12px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <p class="eyebrow">JAVACORE / ДОМАШНЯЯ РАБОТА № 4</p>
        <h1>Пользователи</h1>
        <p class="intro">Поиск, фильтрация и создание пользователей</p>
    </header>
    <div class="tabs" role="tablist" aria-label="Разделы">
        <button class="tab" id="users-tab" role="tab" aria-selected="true" aria-controls="users-panel" type="button">Пользователи</button>
        <button class="tab" id="create-tab" role="tab" aria-selected="false" aria-controls="create-panel" tabindex="-1" type="button">Создать пользователя</button>
    </div>
    <section id="users-panel" role="tabpanel" aria-labelledby="users-tab">
        <section class="panel search" aria-labelledby="search-title">
            <h2 id="search-title">Найти пользователей</h2>
            <form id="search-form">
                <div class="filters">
                    <div class="field operation-field">
                        <label for="operation">Операция</label>
                        <select id="operation">
                            <option value="id">По ID</option>
                            <option value="index">По индексу без сортировки</option>
                            <option value="sorted">Сортировка по имени</option>
                            <option value="birthDate">По дате рождения</option>
                            <option value="older">Родившиеся раньше даты</option>
                            <option value="between">Диапазон дат рождения</option>
                            <option value="year">По году рождения</option>
                            <option value="email">По трём символам email</option>
                        </select>
                    </div>
                    <div id="search-fields" style="display: contents"></div>
                    <button class="button" id="search-submit" type="submit">Найти</button>
                    <button class="button secondary" id="show-all" type="button">Все пользователи</button>
                </div>
                <p class="hint" id="search-hint"></p>
            </form>
        </section>
        <p id="list-status" class="status" role="status" aria-live="polite" hidden></p>
        <section class="panel" aria-labelledby="results-title" id="results" aria-busy="false">
            <div class="table-heading">
                <h2 id="results-title">Все пользователи</h2>
                <span class="count" id="result-count">Найдено: 0</span>
            </div>
            <div class="table-scroll" role="region" aria-label="Таблица пользователей" tabindex="0">
                <table aria-labelledby="results-title">
                    <thead><tr><th scope="col">ID</th><th scope="col">Имя</th><th scope="col">Дата рождения</th><th scope="col">Город</th><th scope="col">Адрес</th><th scope="col">Email</th><th scope="col">Телефон</th></tr></thead>
                    <tbody id="users-body"></tbody>
                </table>
            </div>
        </section>
    </section>
    <section id="create-panel" class="panel create-panel" role="tabpanel" aria-labelledby="create-tab" hidden>
        <h2>Новый пользователь</h2>
        <p class="hint" style="margin: -8px 0 22px">Заполните все поля. ID будет назначен автоматически.</p>
        <form id="create-form">
            <div class="form-grid">
                <div class="field wide"><label for="name">Имя</label><input id="name" name="name" autocomplete="name" required></div>
                <div class="field"><label for="birthDate">Дата рождения</label><input id="birthDate" name="birthDate" type="date" required></div>
                <div class="field"><label for="city">Город</label><input id="city" name="city" autocomplete="address-level2" required></div>
                <div class="field wide"><label for="address">Адрес</label><input id="address" name="address" autocomplete="street-address" required></div>
                <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
                <div class="field"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
            </div>
            <button class="button" id="create-submit" type="submit">Создать пользователя</button>
        </form>
        <p id="create-status" class="status" role="status" aria-live="polite" style="margin-top: 18px" hidden></p>
    </section>
</main>
<script>
    'use strict';

    // Контракт API. При реализации контроллеров адреса можно изменить здесь.
    const API_BASE = '/api/users';
    const query = (path, params) => `${API_BASE}/${path}?${new URLSearchParams(params)}`;
    const API = {
        all: () => API_BASE,
        id: ({ value }) => `${API_BASE}/${encodeURIComponent(value)}`,
        index: ({ value }) => query('by-index', { index: value }),
        sorted: () => `${API_BASE}/sorted-by-name`,
        birthDate: ({ value }) => query('by-birth-date', { birthDate: value }),
        older: ({ value }) => query('older-than', { birthDate: value }),
        between: ({ from, to }) => query('between-birth-dates', { from, to }),
        year: ({ value }) => query('by-year', { year: value }),
        email: ({ value }) => query('by-email', { chars: value }),
        create: () => API_BASE
    };
    const OPERATIONS = {
        id: { label: 'Поиск по ID', fields: [['value', 'ID пользователя', 'text']], hint: 'Введите положительный целочисленный ID.' },
        index: { label: 'Поиск по индексу', fields: [['value', 'Индекс', 'text']], hint: 'Индексы начинаются с нуля. Порядок определяет сервер.' },
        sorted: { label: 'Сортировка по имени', fields: [], hint: 'Пользователи в порядке возрастания имени.' },
        birthDate: { label: 'Поиск по дате рождения', fields: [['value', 'Дата рождения', 'date']], hint: 'Найти пользователей с указанной датой рождения.' },
        older: { label: 'Родившиеся раньше даты', fields: [['value', 'Родились раньше', 'date']], hint: 'Выбранная дата не входит в результат.' },
        between: { label: 'Диапазон дат рождения', fields: [['from', 'С даты', 'date'], ['to', 'По дату', 'date']], hint: 'Обе границы диапазона включаются в результат.' },
        year: { label: 'Поиск по году рождения', fields: [['value', 'Год рождения', 'number']], hint: 'Введите год от 1 до 9999.' },
        email: { label: 'Поиск по трём символам email', fields: [['value', 'Три символа email', 'text']], hint: 'Введите ровно три символа. Правила сопоставления определяет сервер.' }
    };
    const $ = id => document.getElementById(id);
    let listController;
    let listVersion = 0;
    let creating = false;

    function showStatus(id, text, kind = '') {
        const element = $(id);
        element.textContent = text;
        element.className = `status ${kind}`;
        element.hidden = !text;
    }

    function switchTab(tab) {
        for (const name of ['users', 'create']) {
            const selected = name === tab;
            $(`${name}-tab`).setAttribute('aria-selected', String(selected));
            $(`${name}-tab`).tabIndex = selected ? 0 : -1;
            $(`${name}-panel`).hidden = !selected;
        }
    }

    function updateSearchFields() {
        const operation = $('operation').value;
        const config = OPERATIONS[operation];
        $('search-fields').replaceChildren();
        for (const [key, label, type] of config.fields) {
            const wrapper = document.createElement('div');
            wrapper.className = 'field';
            const caption = document.createElement('label');
            caption.htmlFor = `filter-${key}`;
            caption.textContent = label;
            const input = document.createElement('input');
            input.id = `filter-${key}`;
            input.name = key;
            input.type = type;
            input.required = true;
            input.setAttribute('aria-describedby', 'search-hint');
            if (operation === 'id' || operation === 'index') {
                input.inputMode = 'numeric';
                input.pattern = '[0-9]+';
            }
            if (operation === 'year') {
                input.min = '1'; input.max = '9999'; input.step = '1';
            }
            if (operation === 'email') input.maxLength = 3;
            wrapper.append(caption, input);
            $('search-fields').append(wrapper);
        }
        $('search-submit').textContent = operation === 'sorted' ? 'Сортировать' : 'Найти';
        $('search-hint').textContent = config.hint;
    }

    function validateSearch(operation, values) {
        if (operation === 'id' || operation === 'index') {
            // Строковая проверка сохраняет точность Java long за пределами Number.MAX_SAFE_INTEGER.
            if (!/^\d+$/.test(values.value) || (operation === 'id' && /^0+$/.test(values.value))) {
                return operation === 'id' ? 'ID должен быть положительным целым числом.' : 'Индекс должен быть целым числом от нуля.';
            }
        }
        if (operation === 'year' && (!/^\d{1,4}$/.test(values.value) || Number(values.value) < 1)) return 'Введите год от 1 до 9999.';
        if (operation === 'email' && Array.from(values.value).length !== 3) return 'Введите ровно три символа email.';
        if (operation === 'between' && values.from > values.to) return 'Начало диапазона не может быть позже его конца.';
        return '';
    }

    function displayDate(value) {
        if (!value) return '—';
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        return match ? `${match[3]}.${match[2]}.${match[1]}` : String(value);
    }

    function renderUsers(users, emptyText = 'Пользователи не найдены') {
        const body = $('users-body');
        body.replaceChildren();
        $('result-count').textContent = `Найдено: ${users.length}`;
        if (!users.length) {
            const row = document.createElement('tr');
            const cell = document.createElement('td');
            cell.colSpan = 7; cell.className = 'empty-row'; cell.textContent = emptyText;
            row.append(cell); body.append(row);
            return;
        }
        for (const user of users) {
            const row = document.createElement('tr');
            for (const value of [user.id, user.name, displayDate(user.birthDate), user.city, user.address, user.email, user.phone]) {
                const cell = document.createElement('td');
                cell.textContent = value === null || value === undefined || value === '' ? '—' : String(value);
                row.append(cell);
            }
            body.append(row);
        }
    }

    async function responseError(response, single) {
        if (response.status === 404 && single) return 'Пользователь не найден (HTTP 404).';
        let message = '';
        try {
            const body = await response.text();
            const json = JSON.parse(body);
            const detail = json.detail || json.message || json.error;
            if (typeof detail === 'string') message = detail.slice(0, 300);
        } catch { /* Не показываем пользователю HTML или трассировку сервера. */ }
        return `Не удалось выполнить запрос (HTTP ${response.status}).${message ? ` ${message}` : ' Проверьте доступность операции на сервере.'}`;
    }

    async function loadUsers(operation = 'all', values = {}) {
        listController?.abort();
        const controller = new AbortController();
        listController = controller;
        const version = ++listVersion;
        const current = () => version === listVersion;
        const single = operation === 'id' || operation === 'index';
        $('search-submit').disabled = true;
        $('show-all').disabled = true;
        $('results').setAttribute('aria-busy', 'true');
        $('results-title').textContent = operation === 'all' ? 'Все пользователи' : OPERATIONS[operation].label;
        renderUsers([], 'Загрузка…');
        showStatus('list-status', 'Загружаем пользователей…');
        try {
            const response = await fetch(API[operation](values), { signal: controller.signal });
            if (!response.ok) throw new Error(await responseError(response, single));
            const data = await response.json();
            if (!current()) return;
            const users = single ? (data === null ? [] : [data]) : data;
            if (!Array.isArray(users) || users.some(user => !user || typeof user !== 'object' || Array.isArray(user))) {
                throw new Error('Сервер вернул неожиданный формат данных.');
            }
            renderUsers(users);
            showStatus('list-status', '');
        } catch (error) {
            if (!current() || error.name === 'AbortError') return;
            renderUsers([], 'Не удалось загрузить пользователей');
            showStatus('list-status', error instanceof TypeError ? 'Не удалось связаться с сервером. Проверьте подключение и запуск приложения.' : error.message, 'error');
        } finally {
            if (current()) {
                $('search-submit').disabled = false;
                $('show-all').disabled = false;
                $('results').setAttribute('aria-busy', 'false');
            }
        }
    }

    $('operation').addEventListener('change', updateSearchFields);
    $('search-form').addEventListener('submit', event => {
        event.preventDefault();
        if ($('search-submit').disabled || !$('search-form').reportValidity()) return;
        const operation = $('operation').value;
        const values = Object.fromEntries(new FormData($('search-form')));
        const error = validateSearch(operation, values);
        if (error) { showStatus('list-status', error, 'error'); return; }
        loadUsers(operation, values);
    });
    $('show-all').addEventListener('click', () => {
        $('search-form').reset();
        updateSearchFields();
        loadUsers();
    });
    for (const name of ['users', 'create']) {
        $(`${name}-tab`).addEventListener('click', () => switchTab(name));
        $(`${name}-tab`).addEventListener('keydown', event => {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            event.preventDefault();
            const target = event.key === 'Home' ? 'users' : event.key === 'End' ? 'create' : name === 'users' ? 'create' : 'users';
            switchTab(target);
            $(`${target}-tab`).focus();
        });
    }
    $('create-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (creating || !$('create-form').reportValidity()) return;
        const user = Object.fromEntries(new FormData($('create-form')));
        for (const key of Object.keys(user)) user[key] = user[key].trim();
        if (Object.values(user).some(value => !value)) {
            showStatus('create-status', 'Заполните все поля: значения не должны состоять только из пробелов.', 'error');
            return;
        }
        creating = true;
        $('create-submit').disabled = true;
        showStatus('create-status', 'Сохраняем пользователя…');
        try {
            const response = await fetch(API.create(), {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(user)
            });
            if (!response.ok) throw new Error(await responseError(response, false));
            const created = await response.json();
            $('create-form').reset();
            showStatus('create-status', `Пользователь «${created.name || user.name}» создан. Список обновлён на вкладке «Пользователи».`, 'success');
            $('search-form').reset();
            updateSearchFields();
            await loadUsers();
            if (!$('list-status').hidden) showStatus('create-status', `Пользователь создан, но список обновить не удалось. Откройте вкладку «Пользователи» и повторите загрузку.`, 'success');
        } catch (error) {
            showStatus('create-status', error instanceof TypeError ? 'Не удалось связаться с сервером. Проверьте список пользователей перед повторной отправкой.' : error.message, 'error');
        } finally {
            creating = false;
            $('create-submit').disabled = false;
        }
    });
    updateSearchFields();
    loadUsers();
</script>
</body>
</html>
